<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日期筛选 - 农历查询</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0 1rem 3rem; font-size: 15px; color: #333; font-family: system-ui, sans-serif; background: #f5f6f8; }
    h1 { text-align: center; margin: 1rem 0 0.25rem; }
    .back-link { display: block; text-align: center; margin-bottom: 1.25rem; color: #1698ee; text-decoration: none; font-size: 0.9em; }
    .back-link:hover { text-decoration: underline; }
    .container { max-width: 960px; margin: 0 auto; }

    /* Top controls card */
    .card { background: #fff; border-radius: 10px; border: 1px solid #e0e2e8; margin-bottom: 0.85rem; }
    .card-body { padding: 0.9rem 1rem; }
    .top-controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
    .ctrl-group { display: flex; flex-direction: column; gap: 0.2rem; }
    .ctrl-group label { color: #777; font-size: 0.82em; }
    input[type="date"], select {
      padding: 0.32rem 0.5rem; border: 1px solid #c4c4c4; border-radius: 6px;
      font-size: 0.95em; color: #333; background: #fff; min-width: 130px;
    }
    input[type="date"]:focus, select:focus { outline: #1698ee auto 1px; }
    .date-sep { align-self: flex-end; padding-bottom: 0.35rem; color: #888; }

    /* Filter panels */
    .filter-panel { background: #fff; border-radius: 10px; border: 1px solid #e0e2e8; margin-bottom: 0.85rem; overflow: hidden; }
    .filter-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 0.9rem; cursor: pointer; user-select: none;
      background: #f8f9fb; border-bottom: 1px solid transparent; transition: background 0.15s;
    }
    .filter-header:hover { background: #eef2f7; }
    .filter-header.open { border-bottom-color: #e0e2e8; }
    .filter-title { font-weight: 600; font-size: 0.95em; }
    .filter-badge { font-size: 0.8em; color: #aaa; margin-left: 0.45rem; }
    .filter-badge.active { color: #1698ee; }
    .filter-header-right { display: flex; align-items: center; gap: 0.5rem; }
    .expand-icon { color: #aaa; font-size: 0.8em; transition: transform 0.2s; }
    .expand-icon.open { transform: rotate(180deg); }
    .btn-sm {
      border: 1px solid #d0d0d0; border-radius: 5px; background: #fff;
      padding: 0.18rem 0.6rem; font-size: 0.78em; color: #555; cursor: pointer;
    }
    .btn-sm:hover { background: #f0f0f0; }
    .filter-body { padding: 0.65rem 0.9rem; display: none; }
    .filter-body.open { display: block; }
    .checkbox-grid { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; }
    .checkbox-item { display: flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
    .checkbox-item input[type="checkbox"] { cursor: pointer; width: 14px; height: 14px; accent-color: #1698ee; }
    .checkbox-item label { cursor: pointer; font-size: 0.9em; }

    /* Search button */
    .search-row { display: flex; justify-content: center; margin: 1rem 0; gap: 1rem; }
    button.primary {
      background: #1698ee; border: 1px solid #1698ee; border-radius: 8px;
      color: #fff; font-size: 1em; padding: 0.5rem 2.5rem; cursor: pointer;
    }
    button.primary:hover { background: #0d82d4; }
    button.primary:active { background: #0a6cb8; }
    button.primary:disabled { background: #8ec8f5; border-color: #8ec8f5; cursor: not-allowed; }

    /* Status */
    #status { text-align: center; min-height: 1.8rem; padding: 0.25rem; color: #666; font-size: 0.92em; }
    .loading { color: #1698ee; }
    .error-msg { color: #d44; }

    /* Results */
    .result-info { text-align: center; margin-bottom: 0.5rem; font-size: 0.88em; color: #666; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #e0e2e8; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    thead th {
      background: #f0f4f8; padding: 0.45rem 0.7rem; text-align: center;
      border-bottom: 2px solid #d0d5dd; white-space: nowrap; font-weight: 600; color: #444;
    }
    tbody td { padding: 0.38rem 0.65rem; border-bottom: 1px solid #edf0f4; text-align: center; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    .tag { display: inline-block; border-radius: 4px; padding: 0.08rem 0.35rem; font-size: 0.85em; margin: 1px; }
    .tag-san { background: #e6f7e6; color: #2a7a2a; border: 1px solid #c3e6c3; }
    .tag-liu { background: #fff4e0; color: #8a5c00; border: 1px solid #f5dea0; }
    .huang-dao { color: #b07a00; }
    .hei-dao { color: #888; }
    .no-results { text-align: center; color: #aaa; padding: 2rem; font-size: 0.95em; }

    /* Expandable detail rows */
    .toggle-btn {
      border: 1px solid #d0d0d0; border-radius: 5px; background: #fff;
      padding: 0.15rem 0.55rem; font-size: 0.78em; color: #555; cursor: pointer; white-space: nowrap;
    }
    .toggle-btn:hover { background: #f0f0f0; }
    .toggle-btn.active { background: #e8f4fd; border-color: #68b8ee; color: #1698ee; }
    tbody tr:not(.detail-row):hover { background: #f4f8ff; }
    .detail-row { display: none; }
    .detail-row.open { display: table-row; }
    .detail-row > td { padding: 0; background: #f5f8ff; border-bottom: 2px solid #d0d8ea; }
    .detail-panel { padding: 0.65rem 1rem; display: flex; flex-wrap: wrap; gap: 0.55rem 2.5rem; }
    .detail-row-item { display: flex; align-items: flex-start; gap: 0.4rem; }
    .detail-row-item.wide { width: 100%; }
    .dl { font-weight: 600; color: #555; white-space: nowrap; font-size: 0.83em; min-width: 4em; padding-top: 0.15rem; }
    .dv { font-size: 0.85em; color: #444; line-height: 1.7; }
    .tag-good { background: #e6f7e6; color: #2a7a2a; border: 1px solid #b8e0b8; display: inline-block; border-radius: 4px; padding: 0.05rem 0.3rem; font-size: 0.82em; margin: 1px; }
    .tag-bad  { background: #fde8e8; color: #a33030; border: 1px solid #f0bcbc; display: inline-block; border-radius: 4px; padding: 0.05rem 0.3rem; font-size: 0.82em; margin: 1px; }
  </style>
</head>
<body>
  <h1>日期筛选</h1>
  <a class="back-link" href="/">← 返回日期查询</a>

  <div class="container">
    <!-- Date range & type -->
    <div class="card">
      <div class="card-body">
        <div class="top-controls">
          <div class="ctrl-group">
            <label for="startDate">开始日期</label>
            <input type="date" id="startDate">
          </div>
          <span class="date-sep">至</span>
          <div class="ctrl-group">
            <label for="endDate">结束日期（最多366天）</label>
            <input type="date" id="endDate">
          </div>
          <div class="ctrl-group">
            <label for="typeSelector">算法</label>
            <select id="typeSelector">
              <option value="1">月柱算法（默认）</option>
              <option value="2">立春切换算法</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter panels (rendered by JS) -->
    <div id="filters"></div>

    <div class="search-row">
      <button class="primary" id="searchBtn" onclick="search()">开始筛选</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const CLASH_OPTIONS = [
      '鼠日冲马','牛日冲羊','虎日冲猴','兔日冲鸡','龙日冲狗','蛇日冲猪',
      '马日冲鼠','羊日冲牛','猴日冲虎','鸡日冲兔','狗日冲龙','猪日冲蛇'
    ];
    const STARS_OPTIONS = [
      '角木蛟','亢金龙','氐土貉','房日兔','心月狐','尾火虎','箕水豹',
      '斗木獬','牛金牛','女土蝠','虚日鼠','危月燕','室火猪','壁水貐',
      '奎木狼','娄金狗','胃土雉','昴日鸡','毕月乌','觜火猴','参水猿',
      '井木犴','鬼金羊','柳土獐','星日马','张月鹿','翼火蛇','轸水蚓'
    ];
    const OFFICER_OPTIONS = ['建','除','满','平','定','执','破','危','成','收','开','闭'];
    const ZODIAC_OPTIONS  = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

    const FILTER_DEFS = [
      { id: 'clash',   label: '生肖冲煞', param: 'clash',   options: CLASH_OPTIONS,   hint: '不限时匹配全部' },
      { id: 'stars',   label: '廿八宿',   param: 'stars',   options: STARS_OPTIONS,   hint: '不限时匹配全部' },
      { id: 'officer', label: '十二神',   param: 'officer', options: OFFICER_OPTIONS, hint: '按建除字筛选，不限时匹配全部' },
      { id: 'san_he',  label: '今日三合', param: 'san_he',  options: ZODIAC_OPTIONS,  hint: '日期三合包含任一所选生肖即匹配' },
      { id: 'liu_he',  label: '今日六合', param: 'liu_he',  options: ZODIAC_OPTIONS,  hint: '不限时匹配全部' },
    ];

    function renderFilters() {
      const container = document.getElementById('filters');
      FILTER_DEFS.forEach(f => {
        const panel = document.createElement('div');
        panel.className = 'filter-panel';
        panel.innerHTML = `
          <div class="filter-header" id="hdr-${f.id}" onclick="togglePanel('${f.id}')">
            <span>
              <span class="filter-title">${f.label}</span>
              <span class="filter-badge" id="badge-${f.id}">不限</span>
            </span>
            <div class="filter-header-right">
              <button class="btn-sm" onclick="event.stopPropagation(); selectAll('${f.id}', true)">全选</button>
              <button class="btn-sm" onclick="event.stopPropagation(); selectAll('${f.id}', false)">清空</button>
              <span class="expand-icon" id="icon-${f.id}">▼</span>
            </div>
          </div>
          <div class="filter-body" id="body-${f.id}">
            <div class="checkbox-grid" id="grid-${f.id}"></div>
            <div style="font-size:0.78em;color:#aaa;margin-top:0.45rem">${f.hint}</div>
          </div>
        `;
        container.appendChild(panel);

        const grid = panel.querySelector(`#grid-${f.id}`);
        f.options.forEach(opt => {
          const item = document.createElement('div');
          item.className = 'checkbox-item';
          const cbId = `cb_${f.id}_${opt}`;
          item.innerHTML = `<input type="checkbox" id="${cbId}" value="${opt}" onchange="updateBadge('${f.id}')"><label for="${cbId}">${opt}</label>`;
          grid.appendChild(item);
        });
      });
    }

    function togglePanel(id) {
      const body = document.getElementById(`body-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      const hdr  = document.getElementById(`hdr-${id}`);
      const open = body.classList.toggle('open');
      icon.classList.toggle('open', open);
      hdr.classList.toggle('open', open);
    }

    function selectAll(id, checked) {
      document.querySelectorAll(`#grid-${id} input[type="checkbox"]`).forEach(cb => cb.checked = checked);
      updateBadge(id);
    }

    function updateBadge(id) {
      const checked = [...document.querySelectorAll(`#grid-${id} input[type="checkbox"]:checked`)];
      const badge = document.getElementById(`badge-${id}`);
      if (checked.length === 0) {
        badge.textContent = '不限';
        badge.className = 'filter-badge';
      } else {
        badge.textContent = `已选 ${checked.length} 项`;
        badge.className = 'filter-badge active';
      }
    }

    function getFilterValues(id) {
      return [...document.querySelectorAll(`#grid-${id} input[type="checkbox"]:checked`)].map(cb => cb.value);
    }

    function initDates() {
      const today = new Date();
      const end = new Date(today);
      end.setMonth(end.getMonth() + 1);
      document.getElementById('startDate').value = fmtDate(today);
      document.getElementById('endDate').value = fmtDate(end);
    }

    function fmtDate(d) {
      return d.toISOString().slice(0, 10);
    }

    async function search() {
      const start = document.getElementById('startDate').value;
      const end   = document.getElementById('endDate').value;
      const type  = document.getElementById('typeSelector').value;
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('results');
      const btn = document.getElementById('searchBtn');

      if (!start || !end) {
        statusEl.innerHTML = '<span class="error-msg">请选择日期范围</span>';
        return;
      }

      const params = new URLSearchParams({ start, end, type });
      FILTER_DEFS.forEach(f => {
        const vals = getFilterValues(f.id);
        if (vals.length > 0) params.set(f.param, vals.join(','));
      });

      btn.disabled = true;
      statusEl.innerHTML = '<span class="loading">筛选计算中，请稍候…</span>';
      resultsEl.innerHTML = '';

      try {
        const resp = await fetch(`/date_filter?${params}`);
        if (!resp.ok) throw new Error(resp.statusText);
        const data = await resp.json();

        if (data.code !== 0) {
          statusEl.innerHTML = `<span class="error-msg">${data.msg}</span>`;
          return;
        }

        statusEl.innerHTML = `共找到 <strong>${data.total}</strong> 个符合条件的日期`;
        renderResults(data.data);
      } catch (e) {
        statusEl.innerHTML = `<span class="error-msg">请求失败：${e.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderResults(rows) {
      const resultsEl = document.getElementById('results');
      if (rows.length === 0) {
        resultsEl.innerHTML = '<div class="no-results">没有符合条件的日期</div>';
        return;
      }

      let html = `<div class="table-wrap"><table>
        <thead><tr>
          <th>公历日期</th>
          <th>星期</th>
          <th>农历</th>
          <th>生肖冲煞</th>
          <th>廿八宿</th>
          <th>十二神</th>
          <th>今日三合</th>
          <th>今日六合</th>
          <th></th>
        </tr></thead>
        <tbody>`;

      rows.forEach((r, i) => {
        const typeClass = r.day_type === '黄道日' ? 'huang-dao' : 'hei-dao';
        const sanHe = r.san_he.map(z => `<span class="tag tag-san">${z}</span>`).join(' ');
        html += `<tr>
          <td>${r.date}</td>
          <td>${r.weekday}</td>
          <td>${r.lunar}</td>
          <td>${r.clash}</td>
          <td>${r.stars}</td>
          <td class="${typeClass}">${r.officer}&nbsp;·&nbsp;${r.officer_god}<br><small>${r.day_type}</small></td>
          <td>${sanHe}</td>
          <td><span class="tag tag-liu">${r.liu_he}</span></td>
          <td><button class="toggle-btn" id="toggle-${i}" onclick="toggleDetail(${i})">详情</button></td>
        </tr>`;

        const goodGods   = r.good_god.join('、')   || '无';
        const badGods    = r.bad_god.join('、')    || '无';
        const goodThings = r.good_thing.length
          ? r.good_thing.map(t => `<span class="tag tag-good">${t}</span>`).join('')
          : '<span style="color:#aaa">无</span>';
        const badThings  = r.bad_thing.length
          ? r.bad_thing.map(t => `<span class="tag tag-bad">${t}</span>`).join('')
          : '<span style="color:#aaa">无</span>';

        html += `<tr class="detail-row" id="detail-${i}">
          <td colspan="9">
            <div class="detail-panel">
              <div class="detail-row-item"><span class="dl">宜忌等第</span><span class="dv">${r.level_name}</span></div>
              <div class="detail-row-item"><span class="dl">吉神</span><span class="dv">${goodGods}</span></div>
              <div class="detail-row-item"><span class="dl">凶煞</span><span class="dv">${badGods}</span></div>
              <div class="detail-row-item wide"><span class="dl">宜</span><div class="dv">${goodThings}</div></div>
              <div class="detail-row-item wide"><span class="dl">忌</span><div class="dv">${badThings}</div></div>
            </div>
          </td>
        </tr>`;
      });

      html += '</tbody></table></div>';
      resultsEl.innerHTML = html;
    }

    function toggleDetail(i) {
      const row = document.getElementById(`detail-${i}`);
      const btn = document.getElementById(`toggle-${i}`);
      const open = row.classList.toggle('open');
      btn.textContent = open ? '收起' : '详情';
      btn.classList.toggle('active', open);
    }

    renderFilters();
    initDates();
  </script>
</body>
</html>
